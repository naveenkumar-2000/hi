<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Greenden</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white border-b border-stone-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌱</span>
        <span class="text-xl font-bold tracking-tight text-emerald-800">Greenden</span>
      </div>
      <nav class="flex gap-6 md:gap-8 font-medium">
        <a href="index.html" class="text-stone-600 hover:text-emerald-600 transition">Home</a>
        <a href="products.html" class="text-stone-600 hover:text-emerald-600 transition">Products</a>
        <a href="contact.html" class="text-emerald-600 hover:text-emerald-700 transition">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Contact Form Section -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="grid md:grid-cols-3 gap-12 bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs">
      
      <!-- Side Information Panel -->
      <div class="bg-emerald-800 text-emerald-50 p-8 flex flex-col justify-between space-y-8">
        <div class="space-y-4">
          <h3 class="text-2xl font-bold text-white">Get in touch</h3>
          <p class="text-emerald-200/90 text-sm">Have questions about plant care or delivery details? Reach out anytime!</p>
        </div>
        
        <div class="space-y-4 text-sm">
          <div class="flex items-center gap-3">
            <span>📍</span>
            <span>123 Green Lane, Eco City, 56789</span>
          </div>
          <div class="flex items-center gap-3">
            <span>✉️</span>
            <span>support@greenden.com</span>
          </div>
          <div class="flex items-center gap-3">
            <span>📞</span>
            <span>+1 (555) 019-2834</span>
          </div>
        </div>

        <div class="text-xs text-emerald-300">
          Response window: Under 24 hours.
        </div>
      </div>

      <!-- Main Input Interactive Section -->
      <div class="md:col-span-2 p-8">
        <form action="#" method="POST" class="space-y-6">
          <div class="grid sm:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label for="name" class="text-xs font-semibold uppercase tracking-wider text-stone-500">Full Name</label>
              <input type="text" id="name" name="name" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition outline-none">
            </div>
            <div class="space-y-2">
              <label for="email" class="text-xs font-semibold uppercase tracking-wider text-stone-500">Email Address</label>
              <input type="email" id="email" name="email" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition outline-none">
            </div>
          </div>

          <div class="space-y-2">
            <label for="message" class="text-xs font-semibold uppercase tracking-wider text-stone-500">Your Message</label>
            <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition outline-none resize-none"></textarea>
          </div>

          <button type="submit" class="w-full sm:w-auto px-6 py-3 text-sm font-semibold rounded-lg shadow-xs text-white bg-emerald-600 hover:bg-emerald-700 transition cursor-pointer">
            Send Message
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-stone-900 text-stone-400 py-8 border-t border-stone-800 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm">
      <p>&copy; 2026 Greenden. Designed with HTML & Tailwind CSS.</p>
    </div>
  </footer>

</body>
</html>
